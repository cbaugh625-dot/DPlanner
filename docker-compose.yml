# Local Postgres for offline development.
# The app also works against a hosted Supabase Postgres — just point
# DATABASE_URL at it (see .env.example).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dplanner
      POSTGRES_PASSWORD: dplanner
      POSTGRES_DB: dplanner
    ports:
      - "5432:5432"
    volumes:
      - dplanner-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dplanner-pgdata:
